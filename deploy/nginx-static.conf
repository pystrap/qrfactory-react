# Include inside your HTTPS server block; point root at the deployed React dist/.
# API/media proxy locations are deployment-specific and should be defined separately.
root /srv/qrfactory/dist;
index index.html;

# Resolve prerendered public routes without adding a trailing slash to canonical URLs.
location = /create { try_files /create/index.html =404; }
location = /pricing { try_files /pricing/index.html =404; }
location = /batch { try_files /batch/index.html =404; }
location = /how-it-works { try_files /how-it-works/index.html =404; }

# These routes are intentionally excluded from indexing before JavaScript runs.
location ~ ^/(login|register|library|files|projects|account)/?$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /200.html =404;
}
location /share/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /200.html =404;
}
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}
location / {
    try_files $uri $uri/index.html =404;
}
